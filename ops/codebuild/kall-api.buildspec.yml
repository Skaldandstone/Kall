# Buildspec for the kall-api-build CodeBuild project (see docs/AWS_DEPLOYMENT.md).
# Build and deploy are one unit on purpose: an image that was pushed but never
# rolled out is indistinguishable from a failed deploy next time someone looks,
# so the build is not "done" until ECS is stable on the new image.
version: 0.2

phases:
  pre_build:
    # Without ABORT, CodeBuild still runs post_build after a failed phase --
    # which here would deploy whatever :latest happened to be lying around.
    on-failure: ABORT
    commands:
      - aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin 693272753663.dkr.ecr.us-east-2.amazonaws.com
  build:
    on-failure: ABORT
    commands:
      - docker build -t 693272753663.dkr.ecr.us-east-2.amazonaws.com/kall-api:latest -f Dockerfile.api .
  post_build:
    commands:
      - docker push 693272753663.dkr.ecr.us-east-2.amazonaws.com/kall-api:latest
      # The deploy job names the source zip after the commit it tested
      # (source-<sha>.zip), and CODEBUILD_SOURCE_VERSION carries that S3 key.
      # Tagging the image with the commit gives every deploy a rollback
      # target -- :latest alone means the previous image is gone the moment a
      # bad one is pushed. Skipped quietly when the source isn't such a zip.
      - sha="${CODEBUILD_SOURCE_VERSION##*source-}"; sha="${sha%.zip}"; if echo "$sha" | grep -qE '^[0-9a-f]{40}$'; then docker tag 693272753663.dkr.ecr.us-east-2.amazonaws.com/kall-api:latest "693272753663.dkr.ecr.us-east-2.amazonaws.com/kall-api:$sha" && docker push "693272753663.dkr.ecr.us-east-2.amazonaws.com/kall-api:$sha"; fi
      - aws ecs update-service --cluster kall-cluster --service kall-api --force-new-deployment --region us-east-2
      # Fails the build (after ~10 minutes) if the new task never passes health
      # checks, so a bad image surfaces as a red build, not a silent flap.
      - aws ecs wait services-stable --cluster kall-cluster --services kall-api --region us-east-2
