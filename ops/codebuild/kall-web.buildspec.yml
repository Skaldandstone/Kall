# Buildspec for the kall-web-build CodeBuild project (see docs/AWS_DEPLOYMENT.md).
# Same build-then-deploy shape as kall-api.buildspec.yml.
version: 0.2

env:
  secrets-manager:
    # next build inlines NEXT_PUBLIC_* into the client bundle and runs inside
    # the Docker build, so this has to reach it as a build arg -- a plain
    # project variable never gets there. Public by design; the secret key is
    # deliberately NOT available here, because build args land in image history.
    NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: kall/clerk-publishable-key

phases:
  pre_build:
    on-failure: ABORT
    commands:
      - aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin 693272753663.dkr.ecr.us-east-2.amazonaws.com
  build:
    on-failure: ABORT
    commands:
      - docker build --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" -t 693272753663.dkr.ecr.us-east-2.amazonaws.com/kall-web:latest apps/web
  post_build:
    commands:
      - docker push 693272753663.dkr.ecr.us-east-2.amazonaws.com/kall-web:latest
      # Same commit-tagged rollback target as kall-api.buildspec.yml.
      - sha="${CODEBUILD_SOURCE_VERSION##*source-}"; sha="${sha%.zip}"; if echo "$sha" | grep -qE '^[0-9a-f]{40}$'; then docker tag 693272753663.dkr.ecr.us-east-2.amazonaws.com/kall-web:latest "693272753663.dkr.ecr.us-east-2.amazonaws.com/kall-web:$sha" && docker push "693272753663.dkr.ecr.us-east-2.amazonaws.com/kall-web:$sha"; fi
      - aws ecs update-service --cluster kall-cluster --service kall-web --force-new-deployment --region us-east-2
      - aws ecs wait services-stable --cluster kall-cluster --services kall-web --region us-east-2
