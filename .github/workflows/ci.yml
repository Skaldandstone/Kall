name: CI

# push+pull_request both firing for every commit on an open PR branch in
# this repo ran the entire suite twice per commit (one push-triggered run,
# one pull_request-triggered run) -- pure waste, and the two duplicate e2e
# runs for the same commit have been observed to disagree (one clean pass,
# one cascading failure), which is one flake source not worth chasing
# further while this duplication exists. Restricting push to main leaves
# pull_request as the only trigger for PR branches, so each commit runs
# once.
on:
  push:
    branches: [main]
  pull_request:
  # Manual runs validate the current source without cloud credentials.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # All 6 jobs below used to run in full on every push/PR regardless of what
  # changed, which burned the org's monthly Actions minutes fast (a single
  # apps/extension tweak still paid for backend pytest, web e2e, and mobile
  # e2e). This scopes each job to the paths it actually covers. workflow_dispatch
  # (manual validation runs) and any edit to this file itself always run
  # everything, so the filtering can't silently hide a real failure.
  #
  # e2e/accessibility/mobile-e2e (the Playwright jobs -- the most expensive
  # ones) used to run only on pull_request. Direct pushes to main are the
  # normal way changes land in this repo, so that left every mainline
  # commit without browser coverage; a day of mobile-heavy pushes on
  # 2026-09-10 shipped with no e2e run at all. They now run on push to main
  # as well, still scoped to the paths they cover.
  changes:
    runs-on: ubuntu-latest
    # dorny/paths-filter calls the GitHub API to list a PR's changed files,
    # which needs pull-requests: read -- the default GITHUB_TOKEN here
    # doesn't have it, so this job failed outright on every PR run without
    # this grant.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      extension: ${{ steps.filter.outputs.extension }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'migrations/**'
              - 'scripts/**'
              - 'tests/**'
              - 'alembic.ini'
              - 'pyproject.toml'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/web/**'
              - 'tests/clerk-test-safety.test.mjs'
              - '.github/workflows/ci.yml'
            extension:
              - 'apps/extension/**'
              - '.github/workflows/ci.yml'
            mobile:
              - 'apps/mobile/**'
              - '.github/workflows/ci.yml'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # A fast burst of pushes to the same branch (very much a recurring
    # pattern here) used to queue up every one of these test jobs in full
    # when only the latest commit's result matters. This cancels a job
    # still running for the same ref the moment a newer commit shows up.
    # Deliberately job-level so independent test jobs retain their own results.
    concurrency:
      group: ci-backend-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m compileall -q backend tests scripts migrations
      - run: pytest --cov=kall --cov-report=term-missing --cov-report=json:coverage.json --junitxml=junit.xml
      - run: alembic upgrade head
        env:
          APP_ENV: test
          DATABASE_URL: sqlite:///./ci-kall.db
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-test-results
          path: |
            coverage.json
            junit.xml
          retention-days: 30

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: ci-web-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.18.1"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Check Clerk test cleanup safety without credentials
        run: node --experimental-strip-types --test ../../tests/clerk-test-safety.test.mjs
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}

  e2e:
    needs: changes
    # Full-stack: exercises the backend through the web UI, so either side
    # changing can break it. PR-only (not push-to-main): this is the most
    # expensive job here (real Playwright browser run), and every push to
    # main -- including frequent direct pushes that never went through a
    # PR -- was re-paying for it even though the PR gate already covered
    # the same diff for anything merged normally.
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: ci-e2e-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - uses: actions/setup-node@v7
        with:
          node-version: "24.18.1"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        working-directory: apps/web
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      - run: npm run test:e2e
        working-directory: apps/web
        env:
          # Identity lives in Clerk, so e2e signs into a real dev instance.
          # Without these every spec fails at sign-in -- global setup checks
          # for them up front and says so rather than failing one-by-one.
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-junit
          path: apps/web/junit.xml
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

  accessibility:
    needs: changes
    # PR-only, see e2e above.
    if: needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: ci-accessibility-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.18.1"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        working-directory: apps/web
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      # Runs against usability-fixture, a self-contained set of static mockups
      # rather than the real app -- so axe results are deterministic and need
      # no Clerk credentials, unlike the e2e job above.
      - run: npx playwright test --config=playwright.usability.config.ts
        working-directory: apps/web
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: usability-playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

  extension:
    needs: changes
    if: needs.changes.outputs.extension == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: ci-extension-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.18.1"
          cache: npm
          cache-dependency-path: apps/extension/package-lock.json
      - run: npm ci
        working-directory: apps/extension
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('apps/extension/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        working-directory: apps/extension
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        working-directory: apps/extension
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      # popup.js now imports @clerk/chrome-extension, a real npm package a
      # browser cannot load bare -- this only catches a broken import or
      # syntax error; neither test suite below exercises the built bundle's
      # runtime auth behavior, which needs a live Clerk instance and browser.
      - run: npm run build
        working-directory: apps/extension
      # Two suites. The matcher decides where a person's details land on
      # someone else's form, so its refusals matter as much as its matches;
      # the DOM suite drives the real content script against a fixture form,
      # covering the browser-shaped mistakes -- React ignoring a direct .value
      # assignment, a dropdown with no matching option, and above all that
      # nothing ever submits the form.
      - run: npm test
        working-directory: apps/extension

  mobile-e2e:
    needs: changes
    # Runs against the local backend, so backend changes can break it too.
    # PR-only, see e2e above.
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.mobile == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: ci-mobile-e2e-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - uses: actions/setup-node@v7
        with:
          node-version: "24.18.1"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
        working-directory: apps/mobile
      - run: npm run validate:ios-alpha
        working-directory: apps/mobile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('apps/mobile/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        working-directory: apps/mobile
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        working-directory: apps/mobile
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      - run: npm run test:e2e
        working-directory: apps/mobile
        env:
          # Same Clerk dev instance the web e2e job uses -- the mobile app
          # signs into it for real, and the local backend verifies its tokens.
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mobile-e2e-junit
          path: apps/mobile/junit.xml
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: mobile-playwright-report
          path: apps/mobile/playwright-report/
          retention-days: 14
