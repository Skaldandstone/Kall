name: CI

# push+pull_request both firing for every commit on an open PR branch in
# this repo ran the entire suite twice per commit (one push-triggered run,
# one pull_request-triggered run) -- pure waste, and the two duplicate e2e
# runs for the same commit have been observed to disagree (one clean pass,
# one cascading failure), which is one flake source not worth chasing
# further while this duplication exists. Restricting push to main leaves
# pull_request as the only trigger for PR branches, so each commit runs
# once.
on:
  push:
    branches: [main]
  pull_request:
  # Manual runs exist for operational redeploys (config-only changes, a
  # rollback to main's HEAD) -- the full test suite still runs first.
  workflow_dispatch:
    inputs:
      deploy_api:
        description: "Deploy kall-api even if backend paths did not change"
        type: boolean
        default: false
      deploy_web:
        description: "Deploy kall-web even if apps/web did not change"
        type: boolean
        default: false

jobs:
  backend:
    runs-on: ubuntu-latest
    # A fast burst of pushes to the same branch (very much a recurring
    # pattern here) used to queue up every one of these test jobs in full
    # when only the latest commit's result matters. This cancels a job
    # still running for the same ref the moment a newer commit shows up.
    # Deliberately job-level, not workflow-level: `deploy` needs its own
    # in-flight CodeBuild rollout to finish rather than get killed mid-way
    # by the next push, and it already serializes itself via the separate
    # production-deploy group below.
    concurrency:
      group: ci-backend-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m compileall -q backend tests scripts migrations
      - run: pytest --cov=kall --cov-report=term-missing --cov-report=json:coverage.json --junitxml=junit.xml
      - run: alembic upgrade head
        env:
          APP_ENV: test
          DATABASE_URL: sqlite:///./ci-kall.db
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: |
            coverage.json
            junit.xml
          retention-days: 30

  web:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-web-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Check Clerk test cleanup safety without credentials
        run: node --experimental-strip-types --test ../../tests/clerk-test-safety.test.mjs
      - run: npm install
      - run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}

  e2e:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-e2e-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm install
        working-directory: apps/web
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        working-directory: apps/web
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      - run: npm run test:e2e
        working-directory: apps/web
        env:
          # Identity lives in Clerk, so e2e signs into a real dev instance.
          # Without these every spec fails at sign-in -- global setup checks
          # for them up front and says so rather than failing one-by-one.
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-junit
          path: apps/web/junit.xml
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

  extension:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-extension-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/extension/package-lock.json
      - run: npm install
        working-directory: apps/extension
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('apps/extension/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        working-directory: apps/extension
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        working-directory: apps/extension
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      # popup.js now imports @clerk/chrome-extension, a real npm package a
      # browser cannot load bare -- this only catches a broken import or
      # syntax error; neither test suite below exercises the built bundle's
      # runtime auth behavior, which needs a live Clerk instance and browser.
      - run: npm run build
        working-directory: apps/extension
      # Two suites. The matcher decides where a person's details land on
      # someone else's form, so its refusals matter as much as its matches;
      # the DOM suite drives the real content script against a fixture form,
      # covering the browser-shaped mistakes -- React ignoring a direct .value
      # assignment, a dropdown with no matching option, and above all that
      # nothing ever submits the form.
      - run: npm test
        working-directory: apps/extension

  # Production deploy: only on main, only after every test job above passed.
  # The heavy lifting (docker build, ECR push, ECS rollout, stability wait)
  # happens inside CodeBuild under kall-codebuild-role -- see
  # ops/codebuild/*.buildspec.yml and docs/AWS_DEPLOYMENT.md. The credentials
  # this job holds (IAM user kall-github-deploy) can start and watch those two
  # builds and nothing else.
  deploy:
    if: github.repository == 'Skaldandstone/Kall' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [backend, web, e2e, extension, mobile-e2e]
    runs-on: ubuntu-latest
    # One deploy at a time; a newer run supersedes rather than interleaves.
    concurrency: production-deploy
    # checkout needs contents:read; an empty permissions block strips even
    # that and the job dies fetching its own repository.
    permissions:
      contents: read
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.KALL_DEPLOY_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.KALL_DEPLOY_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-2
    steps:
      - uses: actions/checkout@v4
        with:
          # The pushed range is needed to decide which image actually changed.
          fetch-depth: 0
      - name: Decide which services changed
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
          FORCE_API: ${{ inputs.deploy_api }}
          FORCE_WEB: ${{ inputs.deploy_web }}
        run: |
          api=false
          web=false
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            api="$FORCE_API"
            web="$FORCE_WEB"
          elif [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            # Force push or unknown range: rebuild everything rather than guess.
            api=true
            web=true
          else
            changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
            printf 'changed files:\n%s\n' "$changed"
            # Only paths that end up inside the API image (see Dockerfile.api).
            if printf '%s\n' "$changed" | grep -qE '^(backend/|migrations/|Dockerfile\.api|alembic\.ini|pyproject\.toml)'; then
              api=true
            fi
            if printf '%s\n' "$changed" | grep -qE '^apps/web/'; then
              web=true
            fi
          fi
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "deploying: api=$api web=$web"
      - name: Build and deploy via CodeBuild
        if: steps.changes.outputs.api == 'true' || steps.changes.outputs.web == 'true'
        # The repo is private and CodeBuild holds no GitHub credential on
        # purpose, so CodeBuild cannot clone the source itself (its GITHUB
        # source type died in DOWNLOAD_SOURCE with "authentication required").
        # This job already has the gated commit checked out, so it ships the
        # tree to S3 and overrides the build's source to that archive -- which
        # also pins the deploy to the exact commit the tests passed on. The
        # bucket expires objects after 30 days.
        run: |
          zip="source-$GITHUB_SHA.zip"
          git archive --format=zip -o "$zip" "$GITHUB_SHA"
          aws s3 cp --no-progress "$zip" "s3://kall-build-sources-693272753663/github-deploy/$zip"
          ids=()
          if [ "${{ steps.changes.outputs.api }}" = "true" ]; then
            ids+=("$(aws codebuild start-build --project-name kall-api-build \
              --source-type-override S3 \
              --source-location-override "kall-build-sources-693272753663/github-deploy/$zip" \
              --query 'build.id' --output text)")
          fi
          if [ "${{ steps.changes.outputs.web }}" = "true" ]; then
            ids+=("$(aws codebuild start-build --project-name kall-web-build \
              --source-type-override S3 \
              --source-location-override "kall-build-sources-693272753663/github-deploy/$zip" \
              --query 'build.id' --output text)")
          fi
          echo "started: ${ids[*]}"
          fail=0
          for id in "${ids[@]}"; do
            while :; do
              status=$(aws codebuild batch-get-builds --ids "$id" --query 'builds[0].buildStatus' --output text)
              [ "$status" != "IN_PROGRESS" ] && break
              sleep 15
            done
            echo "$id -> $status"
            [ "$status" = "SUCCEEDED" ] || fail=1
          done
          exit "$fail"

  mobile-e2e:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-mobile-e2e-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm install
        working-directory: apps/mobile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('apps/mobile/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        working-directory: apps/mobile
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        working-directory: apps/mobile
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      - run: npm run test:e2e
        working-directory: apps/mobile
        env:
          # Same Clerk dev instance the web e2e job uses -- the mobile app
          # signs into it for real, and the local backend verifies its tokens.
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-e2e-junit
          path: apps/mobile/junit.xml
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: mobile-playwright-report
          path: apps/mobile/playwright-report/
          retention-days: 14
