name: CI

# push+pull_request both firing for every commit on an open PR branch in
# this repo ran the entire suite twice per commit (one push-triggered run,
# one pull_request-triggered run) -- pure waste, and the two duplicate e2e
# runs for the same commit have been observed to disagree (one clean pass,
# one cascading failure), which is one flake source not worth chasing
# further while this duplication exists. Restricting push to main leaves
# pull_request as the only trigger for PR branches, so each commit runs
# once.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m compileall -q backend tests scripts migrations
      - run: pytest --cov=kall --cov-report=term-missing --cov-report=json:coverage.json --junitxml=junit.xml
      - run: alembic upgrade head
        env:
          APP_ENV: test
          DATABASE_URL: sqlite:///./ci-kall.db
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: |
            coverage.json
            junit.xml
          retention-days: 30

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-junit
          path: apps/web/junit.xml
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

  mobile-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
        working-directory: apps/mobile
      - run: npx playwright install --with-deps chromium
        working-directory: apps/mobile
      - run: npm run test:e2e
        working-directory: apps/mobile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-e2e-junit
          path: apps/mobile/junit.xml
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: mobile-playwright-report
          path: apps/mobile/playwright-report/
          retention-days: 14
