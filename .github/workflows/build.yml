# Temporary build-only workflow requested on 2026-08-30 to conserve Actions minutes.
# ci.yml remains disabled at repository level, including for older branches.
# Restore tests by disabling this workflow and re-enabling ci.yml in GitHub Actions.

name: Build

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs build the current source without cloud credentials.
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-web-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm install
      - run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}

  extension:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-extension-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/extension/package-lock.json
      - run: npm install
        working-directory: apps/extension
      - run: npm run build
        working-directory: apps/extension
