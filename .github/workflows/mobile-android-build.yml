name: Build Android (production)

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/src/**'
      - 'apps/mobile/assets/**'
      - 'apps/mobile/plugins/**'
      - 'apps/mobile/scripts/release-store.mjs'
      - 'apps/mobile/App.tsx'
      - 'apps/mobile/app.json'
      - 'apps/mobile/app.config.js'
      - 'apps/mobile/metro.config.js'
      - 'apps/mobile/eas.json'
      - 'apps/mobile/.eas/**'
      - 'apps/mobile/.maestro/**'
      - 'apps/mobile/package.json'
      - 'apps/mobile/package-lock.json'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Install dependencies
        run: npm ci

      - name: Run compiled Android update and launch smoke test
        run: eas workflow:run .eas/workflows/native-e2e-android.yml --non-interactive --wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Queue Android build and automatic closed Alpha submission
        run: npm run release:android -- --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
