name: Build Android (production)

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Install dependencies
        run: npm ci

      # Auto-submit to Google Play's internal testing track needs a service-account
      # JSON key (Play Console > Setup > API access) stored as the
      # GOOGLE_SERVICE_ACCOUNT_KEY repo secret. Until that secret exists, this falls
      # back to queuing the build alone, same as before.
      - name: Check for Google Play service account key
        id: play_submit
        run: echo "enabled=${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY != '' }}" >> "$GITHUB_OUTPUT"

      - name: Write Google Play service account key
        if: steps.play_submit.outputs.enabled == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: printf '%s' "$GOOGLE_SERVICE_ACCOUNT_KEY" > google-service-account.json

      - name: Queue Android build and auto-submit to internal testing
        if: steps.play_submit.outputs.enabled == 'true'
        run: eas build --platform android --profile android-production --non-interactive --no-wait --auto-submit
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Queue Android build
        if: steps.play_submit.outputs.enabled != 'true'
        run: eas build --platform android --profile android-production --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
