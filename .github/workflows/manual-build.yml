# Builds are manual-only to conserve Actions minutes.
# Do not add push, pull_request, or schedule triggers without owner approval.
# Deployment moved to the reviewed replacement-project CloudFormation path.
# This workflow deliberately has no cloud credentials or deployment controls.

name: Manual build

on:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-web-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}

  extension:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-extension-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/extension/package-lock.json
      - run: npm ci
        working-directory: apps/extension
      - run: npm run build
        working-directory: apps/extension
