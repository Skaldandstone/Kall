name: Mobile Store Screenshots

# Manual only: captures Google Play and App Store listing screenshots against a real
# (throwaway) Clerk test account and a real local backend, using the same
# CLERK_SECRET_KEY dev-instance secret apps/mobile's e2e suite already uses.
# It has no business running on every push -- see store-screenshots.spec.ts.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - uses: actions/setup-node@v7
        with:
          node-version: "24.18.1"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
        working-directory: apps/mobile
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('apps/mobile/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        working-directory: apps/mobile
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        working-directory: apps/mobile
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      - name: Capture Android listing screenshots
        run: npx playwright test --grep "capture android store screenshots"
        working-directory: apps/mobile
        env:
          CAPTURE_STORE_SCREENSHOTS: "1"
          STORE_SCREENSHOT_TARGET: android
          KALL_MOBILE_ALLOW_REGISTRATION: "1"
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      - name: Capture iPhone listing screenshots
        run: npx playwright test --grep "capture iphone store screenshots"
        working-directory: apps/mobile
        env:
          CAPTURE_STORE_SCREENSHOTS: "1"
          STORE_SCREENSHOT_TARGET: iphone
          KALL_MOBILE_ALLOW_REGISTRATION: "1"
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      - name: Capture iPad listing screenshots
        run: npx playwright test --grep "capture ipad store screenshots"
        working-directory: apps/mobile
        env:
          CAPTURE_STORE_SCREENSHOTS: "1"
          STORE_SCREENSHOT_TARGET: ipad
          KALL_MOBILE_ALLOW_REGISTRATION: "1"
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mobile-store-screenshots
          path: apps/mobile/e2e/screenshots/
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: mobile-store-screenshots-playwright-report
          path: apps/mobile/playwright-report/
          retention-days: 14
