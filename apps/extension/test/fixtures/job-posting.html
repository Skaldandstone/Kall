<!doctype html>
<html>
<head>
  <title>Fallback Title Should Not Be Used</title>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org/",
    "@type": "JobPosting",
    "title": "Senior Environment Artist",
    "description": "<p>Build worlds with <strong>Unreal Engine</strong>.</p>",
    "hiringOrganization": { "@type": "Organization", "name": "Acme Games" },
    "jobLocation": {
      "@type": "Place",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Austin",
        "addressRegion": "TX",
        "addressCountry": "US"
      }
    }
  }
  </script>
</head>
<body>
  <h1>Senior Environment Artist</h1>
</body>
</html>
