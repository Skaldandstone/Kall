appId: com.skaldandstone.kall
---
- back
- repeat:
    times: 4
    commands:
      - swipe:
          start: 50%, 80%
          end: 50%, 20%
          duration: 500
- scrollUntilVisible:
    element:
      text: "Delete my account.*"
    direction: DOWN
    visibilityPercentage: 50
    centerElement: true
- tapOn: "Delete my account.*"
- extendedWaitUntil:
    visible: This cannot be undone
    timeout: 20000
- assertVisible: Permanently delete my account
