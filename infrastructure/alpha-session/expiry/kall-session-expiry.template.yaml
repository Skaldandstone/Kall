AWSTemplateFormatVersion: '2010-09-09'
Description: Disabled-by-default expiry controller for one bounded Kall sandbox session.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@2

Parameters:
  ManagedStackName:
    Type: String
    AllowedPattern: '^kall-sandbox-[a-f0-9]{12}$'
  SessionId:
    Type: String
    AllowedPattern: '^kall-[a-f0-9]{32}$'
  CreatedAtEpoch:
    Type: Number
    MinValue: 1
  ExpiresAtEpoch:
    Type: Number
    MinValue: 1
  ExpectedAccount:
    Type: String
    Default: '734702670689'
    AllowedPattern: '^\d{12}$'
  ExpectedRegion:
    Type: String
    Default: us-east-2
    AllowedValues: [us-east-2]
  ControllerEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']

Conditions:
  ControllerIsEnabled: !Equals [!Ref ControllerEnabled, 'true']

Resources:
  ExpiryLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /skaldandstone/development/kall-expiry/${SessionId}
      RetentionInDays: 30
      Tags:
        - Key: SkaldAndStone-Product
          Value: kall
        - Key: SkaldAndStone-SessionId
          Value: !Ref SessionId

  RuntimeDeletionRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: Gives CloudFormation the bounded service permissions required to delete the exact Kall sandbox stack.
        must: Be passed only by this session controller; never grant create actions or provider-secret access.
    Properties:
      RoleName: !Sub kall-expiry-${SessionId}-delete
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: exact-kall-runtime-deletion
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadDeletionState
                Effect: Allow
                Action:
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:GetResponseHeadersPolicy
                  - cloudfront:GetResponseHeadersPolicyConfig
                  - cloudfront:ListTagsForResource
                  - cloudwatch:DescribeAlarms
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSecurityGroupRules
                  - ec2:DescribeSecurityGroups
                  - ecs:DescribeServices
                  - ecs:DescribeTaskDefinition
                  - ecs:DescribeTasks
                  - ecs:ListTasks
                  - elasticloadbalancing:DescribeListeners
                  - elasticloadbalancing:DescribeLoadBalancers
                  - elasticloadbalancing:DescribeRules
                  - elasticloadbalancing:DescribeTags
                  - elasticloadbalancing:DescribeTargetGroups
                  - elasticloadbalancing:DescribeTargetHealth
                  - iam:GetRole
                  - iam:GetRolePolicy
                  - iam:ListAttachedRolePolicies
                  - iam:ListInstanceProfilesForRole
                  - iam:ListRolePolicies
                  - iam:ListRoleTags
                  - rds:DescribeDBInstances
                  - rds:DescribeDBParameterGroups
                  - rds:DescribeDBSnapshots
                  - rds:DescribeDBSubnetGroups
                  - rds:ListTagsForResource
                Resource: '*'
              - Sid: DeleteRegionalRuntimeResources
                Effect: Allow
                Action:
                  - cloudwatch:DeleteAlarms
                  - ec2:DeleteSecurityGroup
                  - ec2:RevokeSecurityGroupEgress
                  - ec2:RevokeSecurityGroupIngress
                  - elasticloadbalancing:DeleteListener
                  - elasticloadbalancing:DeleteLoadBalancer
                  - elasticloadbalancing:DeleteRule
                  - elasticloadbalancing:DeleteTargetGroup
                  - rds:DeleteDBInstance
                  - rds:DeleteDBParameterGroup
                  - rds:DeleteDBSubnetGroup
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref ExpectedRegion
              - Sid: DeleteExactEcsWorkloads
                Effect: Allow
                Action:
                  - ecs:DeleteService
                  - ecs:UpdateService
                Resource:
                  - !Sub arn:${AWS::Partition}:ecs:${ExpectedRegion}:${ExpectedAccount}:service/*/kall-alpha-api
                  - !Sub arn:${AWS::Partition}:ecs:${ExpectedRegion}:${ExpectedAccount}:service/*/kall-alpha-web
              - Sid: DeregisterRuntimeTaskDefinitions
                Effect: Allow
                Action: ecs:DeregisterTaskDefinition
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref ExpectedRegion
              - Sid: DeleteExactRuntimeRoles
                Effect: Allow
                Action:
                  - iam:DeleteRole
                  - iam:DeleteRolePolicy
                  - iam:DetachRolePolicy
                  - iam:RemoveRoleFromInstanceProfile
                Resource:
                  - !Sub arn:${AWS::Partition}:iam::${ExpectedAccount}:role/kall-alpha-api-execution
                  - !Sub arn:${AWS::Partition}:iam::${ExpectedAccount}:role/kall-alpha-api-task
                  - !Sub arn:${AWS::Partition}:iam::${ExpectedAccount}:role/kall-alpha-web-execution
                  - !Sub arn:${AWS::Partition}:iam::${ExpectedAccount}:role/kall-alpha-web-task
                  - !Sub arn:${AWS::Partition}:iam::${ExpectedAccount}:role/kall-alpha-bootstrap-execution
                  - !Sub arn:${AWS::Partition}:iam::${ExpectedAccount}:role/kall-alpha-migration-execution
              - Sid: DeleteDatabaseAdminLogGroup
                Effect: Allow
                Action: logs:DeleteLogGroup
                Resource: !Sub arn:${AWS::Partition}:logs:${ExpectedRegion}:${ExpectedAccount}:log-group:/skaldandstone/alpha/kall-database-admin
              - Sid: DeleteRuntimeCloudFrontResources
                Effect: Allow
                Action:
                  - cloudfront:DeleteDistribution
                  - cloudfront:DeleteResponseHeadersPolicy
                  - cloudfront:UpdateDistribution
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudfront::${ExpectedAccount}:distribution/*
                  - !Sub arn:${AWS::Partition}:cloudfront::${ExpectedAccount}:response-headers-policy/*

  ExpiryRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: exact-kall-session-expiry
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ExactRuntimeStack
                Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:DeleteStack
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${ExpectedRegion}:${ExpectedAccount}:stack/${ManagedStackName}/*
              - Sid: PassDeletionRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt RuntimeDeletionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
              - Sid: OwnSchedule
                Effect: Allow
                Action: events:DisableRule
                Resource: !Sub arn:${AWS::Partition}:events:${ExpectedRegion}:${ExpectedAccount}:rule/kall-expiry-${SessionId}
              - Sid: OwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub ${ExpiryLogGroup.Arn}:*

  ExpiryFunction:
    Type: AWS::Lambda::Function
    Properties:
      Architectures: [arm64]
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt ExpiryRole.Arn
      MemorySize: 128
      Timeout: 30
      LoggingConfig:
        LogGroup: !Ref ExpiryLogGroup
      Environment:
        Variables:
          MANAGED_STACK_NAME: !Ref ManagedStackName
          SESSION_ID: !Ref SessionId
          CREATED_AT_EPOCH: !Ref CreatedAtEpoch
          EXPIRES_AT_EPOCH: !Ref ExpiresAtEpoch
          EXPECTED_ACCOUNT: !Ref ExpectedAccount
          EXPECTED_REGION: !Ref ExpectedRegion
          RULE_NAME: !Sub kall-expiry-${SessionId}
          DELETION_ROLE_ARN: !GetAtt RuntimeDeletionRole.Arn
      Code:
        ZipFile: |
          __EXPIRY_HANDLER__
      Tags:
        - Key: SkaldAndStone-Product
          Value: kall
        - Key: SkaldAndStone-SessionId
          Value: !Ref SessionId

  ExpiryRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub kall-expiry-${SessionId}
      Description: Deletes only the exact, correctly tagged Kall sandbox stack after expiry.
      ScheduleExpression: rate(5 minutes)
      State: !If [ControllerIsEnabled, ENABLED, DISABLED]
      Targets:
        - Arn: !GetAtt ExpiryFunction.Arn
          Id: kall-session-expiry
          RetryPolicy:
            MaximumEventAgeInSeconds: 300
            MaximumRetryAttempts: 2

  ExpiryInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ExpiryFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ExpiryRule.Arn

Outputs:
  ControllerState:
    Value: !If [ControllerIsEnabled, ENABLED, DISABLED]
  ManagedStackArnPattern:
    Value: !Sub arn:${AWS::Partition}:cloudformation:${ExpectedRegion}:${ExpectedAccount}:stack/${ManagedStackName}/*
  MaximumSessionSeconds:
    Value: '7200'
