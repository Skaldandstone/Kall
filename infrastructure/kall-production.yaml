AWSTemplateFormatVersion: '2010-09-09'
Description: Durable invite-only Kall production runtime in the Skald and Stone AWS project.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@2
  com.aws.cloudformation.Context:
    arch: CloudFront to TLS ALB to isolated ECS web and API services, with private encrypted PostgreSQL and retained S3 documents.
    must:
      - All Regional resources stay in us-east-2 and project 051722405355.
      - Application services remain stopped until database-role bootstrap and Alembic head verification succeed.
      - Clerk production identity and Stripe live billing remain isolated from development and other products.
      - Stateful storage and generated secrets survive accidental stack deletion or replacement.
      - Public DNS remains externally managed by Cloudflare.
    ref:
      - docs/PRODUCTION_READINESS.md
      - docs/PRODUCTION_DEPLOYMENT.md

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  CloudFrontOriginPrefixListId:
    Type: String
    Default: pl-b6a144df
    AllowedPattern: '^pl-[0-9a-f]+$'
    Description: Verified us-east-2 com.amazonaws.global.cloudfront.origin-facing managed prefix list.
  ClusterName:
    Type: String
    Default: skaldandstone-production
  ApiImage:
    Type: String
    AllowedPattern: '^051722405355\.dkr\.ecr\.us-east-2\.amazonaws\.com/kall-api@sha256:[0-9a-f]{64}$'
    ConstraintDescription: Use an immutable Kall API digest from the reviewed us-east-2 ECR repository.
  WebImage:
    Type: String
    AllowedPattern: '^051722405355\.dkr\.ecr\.us-east-2\.amazonaws\.com/kall-web@sha256:[0-9a-f]{64}$'
    ConstraintDescription: Use an immutable Kall web digest from the reviewed us-east-2 ECR repository.
  ProductionAccessSecretArn:
    Type: String
    AllowedPattern: '^arn:aws:secretsmanager:us-east-2:051722405355:secret:prod/kall/access-[A-Za-z0-9]+$'
    Description: ARN of the externally managed production invitation allowlist secret.
  ClerkSecretArn:
    Type: String
    AllowedPattern: '^arn:aws:secretsmanager:us-east-2:051722405355:secret:prod/kall/clerk-[A-Za-z0-9]+$'
    Description: ARN of the production Clerk secret JSON containing CLERK_SECRET_KEY.
  StripeSecretArn:
    Type: String
    Default: arn:aws:secretsmanager:us-east-2:051722405355:secret:prod/kall/stripe-disabled
    AllowedPattern: '^arn:aws:secretsmanager:us-east-2:051722405355:secret:prod/kall/stripe-[A-Za-z0-9]+$'
    Description: ARN of the production Stripe secret JSON; keep the fail-closed sentinel while live billing is disabled.
  RevenueCatSecretArn:
    Type: String
    Default: arn:aws:secretsmanager:us-east-2:051722405355:secret:prod/kall/revenuecat-disabled
    AllowedPattern: '^arn:aws:secretsmanager:us-east-2:051722405355:secret:prod/kall/revenuecat-[A-Za-z0-9]+$'
    Description: ARN of the RevenueCat webhook secret JSON; keep the fail-closed sentinel while native billing is disabled.
  OriginDomainName:
    Type: String
    AllowedValues: [origin.kall.skaldandstone.com]
    Description: Externally managed DNS-only Cloudflare name mapped to the ALB and covered by OriginCertificateArn.
  OriginCertificateArn:
    Type: String
    AllowedPattern: '^arn:aws:acm:us-east-2:051722405355:certificate/[0-9a-f-]+$'
    ConstraintDescription: Must be an ACM certificate ARN from project 051722405355 in us-east-2.
    Description: us-east-2 ACM certificate ARN for OriginDomainName on the ALB HTTPS listener.
  PublicDomainName:
    Type: String
    AllowedValues: [kall.skaldandstone.com]
    Description: Public Kall hostname managed in Cloudflare DNS.
  ViewerCertificateArn:
    Type: String
    AllowedPattern: '^arn:aws:acm:us-east-1:051722405355:certificate/[0-9a-f-]+$'
    ConstraintDescription: Must be an ACM certificate ARN from project 051722405355 in us-east-1.
    Description: us-east-1 ACM certificate ARN for PublicDomainName on CloudFront.
  OpenAISecretArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws:secretsmanager:us-east-2:051722405355:secret:prod/kall/openai-[A-Za-z0-9]+$'
  SerperSecretArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws:secretsmanager:us-east-2:051722405355:secret:prod/kall/serper-[A-Za-z0-9]+$'
  AdminSecretArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws:secretsmanager:us-east-2:051722405355:secret:prod/kall/admin-[A-Za-z0-9]+$'
    Description: >-
      ARN of the production admin secret JSON containing ADMIN_API_TOKEN, the
      shared token the grok-adminhelper staff portal presents as X-Admin-Token.
      Leave empty to keep every /api/admin/* route closed.
  StripePlusPriceId:
    Type: String
    Default: ''
    AllowedPattern: '^$|^price_[A-Za-z0-9]+$'
  StripePlusProductId:
    Type: String
    Default: ''
    AllowedPattern: '^$|^prod_[A-Za-z0-9]+$'
  StripePremiumPriceId:
    Type: String
    Default: ''
    AllowedPattern: '^$|^price_[A-Za-z0-9]+$'
  StripePremiumProductId:
    Type: String
    Default: ''
    AllowedPattern: '^$|^prod_[A-Za-z0-9]+$'
  StripePortalConfigurationId:
    Type: String
    Default: ''
    AllowedPattern: '^$|^bpc_[A-Za-z0-9]+$'
  RevenueCatGooglePlusProductId:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[a-z0-9._-]+:[a-z0-9._-]+$'
  RevenueCatGooglePremiumProductId:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[a-z0-9._-]+:[a-z0-9._-]+$'
  RevenueCatApplePlusProductId:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[A-Za-z0-9._-]+$'
  RevenueCatApplePremiumProductId:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[A-Za-z0-9._-]+$'
  RevenueCatAcceptedEnvironments:
    Type: String
    Default: PRODUCTION
    AllowedValues: [PRODUCTION, 'PRODUCTION,SANDBOX']
  SentryApiDsn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^https://[0-9a-f]{32}@o[0-9]+\.ingest\.(us|de)\.sentry\.io/[0-9]+$'
    Description: >-
      Sentry DSN for the kall-api project (org skald-and-stone). Public by design - a DSN can
      only send events to one project - so it is a plaintext task variable, not a secret.
      Blank keeps the SDK inert.
  SentryWebDsn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^https://[0-9a-f]{32}@o[0-9]+\.ingest\.(us|de)\.sentry\.io/[0-9]+$'
    Description: >-
      Sentry DSN for the kall-web server and edge runtimes, also served as a request-time
      fallback to the browser on dynamically rendered pages. The browser SDK's primary value is
      the NEXT_PUBLIC_SENTRY_DSN image build argument. Blank keeps the runtimes inert.
  EnableStripeLive:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
  EnableRevenueCatNative:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
  EnableApplicationServices:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: Keep false until database role bootstrap and migration-head verification succeed.
  EnableScheduledJobs:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: >-
      Creates the hourly and daily EventBridge Scheduler targets for the one-shot
      job runner. Keep false until the exact API image and database migration are
      verified; disabling it removes the schedules without changing user data.
  SesSenderEmail:
    Type: String
    AllowedValues: ['', support@skaldandstone.com]
    Default: ''
    Description: >-
      Verified Kall transactional sender. Blank keeps email delivery queued and
      grants the job task no SES permissions.
  EnablePublicSignup:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: >-
      Opens registration to anyone with a Clerk account. Defaults to false, which keeps
      ALPHA_INVITE_ONLY=true and the invitation gate in place. Setting this to true only
      relaxes the application gate; self-service sign-up must also be enabled in the
      production Clerk instance for it to take effect. The allowlist secret is retained
      either way so rollback is a parameter flip, not a redeploy of removed config.
  VerifiedBootstrapRevision:
    Type: String
    AllowedValues: ['', kall-db-roles-v1]
    Default: ''
  VerifiedMigrationHead:
    Type: String
    AllowedValues: ['', '20260831_0029', '20260904_0030', '20260904_0031', '20260905_0032', '20260908_0033', '20260908_0034', '20260909_0035', '20260914_0036']
    Default: ''
  AttachPublicAlias:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: Attach PublicDomainName to CloudFront. Set false only while another distribution still owns the alias during an account migration; move the alias with AssociateAlias, then set true.

Rules:
  ApplicationActivationRequiresDatabaseEvidence:
    RuleCondition: !Equals [!Ref EnableApplicationServices, 'true']
    Assertions:
      - Assert: !Equals [!Ref VerifiedBootstrapRevision, kall-db-roles-v1]
        AssertDescription: Run and verify the kall-db-roles-v1 bootstrap before enabling services.
      - Assert: !Equals [!Ref VerifiedMigrationHead, '20260914_0036']
        AssertDescription: Verify the database is at Alembic head 20260914_0036 before enabling services.
  StripeActivationRequiresLiveCatalog:
    RuleCondition: !Equals [!Ref EnableStripeLive, 'true']
    Assertions:
      - Assert: !Not [!Equals [!Ref StripeSecretArn, '']]
        AssertDescription: Live Stripe requires the production secret ARN.
      - Assert: !Not [!Equals [!Ref StripeSecretArn, 'arn:aws:secretsmanager:us-east-2:051722405355:secret:prod/kall/stripe-disabled']]
        AssertDescription: Live Stripe rejects the disabled secret sentinel.
      - Assert: !Not [!Equals [!Ref StripePlusPriceId, '']]
        AssertDescription: Live Stripe requires the Kall Plus price.
      - Assert: !Not [!Equals [!Ref StripePlusProductId, '']]
        AssertDescription: Live Stripe requires the Kall Plus product.
      - Assert: !Not [!Equals [!Ref StripePremiumPriceId, '']]
        AssertDescription: Live Stripe requires the Kall Premium price.
      - Assert: !Not [!Equals [!Ref StripePremiumProductId, '']]
        AssertDescription: Live Stripe requires the Kall Premium product.
      - Assert: !Not [!Equals [!Ref StripePortalConfigurationId, '']]
        AssertDescription: Live Stripe requires the Kall-only portal configuration.
  RevenueCatActivationRequiresCatalog:
    RuleCondition: !Equals [!Ref EnableRevenueCatNative, 'true']
    Assertions:
      - Assert: !Not [!Equals [!Ref RevenueCatSecretArn, 'arn:aws:secretsmanager:us-east-2:051722405355:secret:prod/kall/revenuecat-disabled']]
        AssertDescription: Native billing rejects the disabled RevenueCat secret sentinel.
      - Assert: !Not [!Equals [!Ref RevenueCatGooglePlusProductId, '']]
        AssertDescription: Native billing requires the Google Plus product.
      - Assert: !Not [!Equals [!Ref RevenueCatGooglePremiumProductId, '']]
        AssertDescription: Native billing requires the Google Premium product.
      - Assert: !Or
          - !And
            - !Equals [!Ref RevenueCatApplePlusProductId, '']
            - !Equals [!Ref RevenueCatApplePremiumProductId, '']
          - !And
            - !Not [!Equals [!Ref RevenueCatApplePlusProductId, '']]
            - !Not [!Equals [!Ref RevenueCatApplePremiumProductId, '']]
        AssertDescription: Native billing Apple products must either both be configured or both remain disabled.

Conditions:
  HasOpenAISecret: !Not [!Equals [!Ref OpenAISecretArn, '']]
  HasSerperSecret: !Not [!Equals [!Ref SerperSecretArn, '']]
  HasAdminSecret: !Not [!Equals [!Ref AdminSecretArn, '']]
  StripeLiveEnabled: !Equals [!Ref EnableStripeLive, 'true']
  RevenueCatNativeEnabled: !Equals [!Ref EnableRevenueCatNative, 'true']
  ApplicationServicesEnabled: !Equals [!Ref EnableApplicationServices, 'true']
  ScheduledJobsEnabled: !Equals [!Ref EnableScheduledJobs, 'true']
  HasSesSender: !Not [!Equals [!Ref SesSenderEmail, '']]
  PublicSignupEnabled: !Equals [!Ref EnablePublicSignup, 'true']
  PublicAliasAttached: !Equals [!Ref AttachPublicAlias, 'true']

Resources:
  AppSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Production-only application signing material generated and stored without exposing its value to CloudFormation parameters.
        must: [Retain on deletion and replacement, Never share with another product or environment]
        mutable: must-never-change
    Properties:
      Description: Kall production application signing secret.
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true
      Tags:
        - Key: Product
          Value: Kall
        - Key: Environment
          Value: production

  SensitiveDataSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Independent key material for encrypted EEO and work-authorization fields.
        must: [Remain distinct from AppSecret, Retain on deletion and replacement]
        mutable: must-never-change
    Properties:
      Description: Kall production sensitive-field encryption secret.
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true
      Tags:
        - Key: Product
          Value: Kall
        - Key: Environment
          Value: production

  RuntimeDatabaseSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Least-privilege PostgreSQL runtime identity, separate from schema migration and the managed master.
        must: [Username remains kall_runtime, Runtime task never receives master or migrator credentials]
        mutable: change-with-constraints
    Properties:
      Description: Kall production runtime database role credentials.
      GenerateSecretString:
        SecretStringTemplate: '{"username":"kall_runtime"}'
        GenerateStringKey: password
        PasswordLength: 40
        ExcludePunctuation: true
      Tags:
        - Key: Product
          Value: Kall
        - Key: Environment
          Value: production

  MigratorDatabaseSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Schema-owner PostgreSQL identity used only by the one-shot migration task.
        must: [Username remains kall_migrator, Application service never receives this secret]
        mutable: change-with-constraints
    Properties:
      Description: Kall production migrator database role credentials.
      GenerateSecretString:
        SecretStringTemplate: '{"username":"kall_migrator"}'
        GenerateStringKey: password
        PasswordLength: 40
        ExcludePunctuation: true
      Tags:
        - Key: Product
          Value: Kall
        - Key: Environment
          Value: production

  ApiExecutionRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: Pulls the API image and injects only runtime provider and database secrets.
        must: [No managed master or migrator secret access]
        mutable: change-with-constraints
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: kall-production-api-secrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref AppSecret
                  - !Ref SensitiveDataSecret
                  - !Ref ProductionAccessSecretArn
                  - !Ref ClerkSecretArn
                  - !Ref RuntimeDatabaseSecret
              - !If
                - StripeLiveEnabled
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref StripeSecretArn
                - !Ref AWS::NoValue
              - !If
                - RevenueCatNativeEnabled
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref RevenueCatSecretArn
                - !Ref AWS::NoValue
              - !If
                - HasOpenAISecret
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref OpenAISecretArn
                - !Ref AWS::NoValue
              - !If
                - HasSerperSecret
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref SerperSecretArn
                - !Ref AWS::NoValue
              - !If
                - HasAdminSecret
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref AdminSecretArn
                - !Ref AWS::NoValue

  BootstrapExecutionRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: One-shot role bootstrap receives the managed master and both generated application-role secrets.
        must: [Never attach to a long-running service]
        mutable: change-with-constraints
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: kall-production-bootstrap-secrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !GetAtt Database.MasterUserSecret.SecretArn
                  - !Ref MigratorDatabaseSecret
                  - !Ref RuntimeDatabaseSecret

  MigrationExecutionRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: One-shot Alembic migration receives the schema-owner identity and production startup material.
        must: [No managed master or runtime database secret access]
        mutable: change-with-constraints
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: kall-production-migration-secrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref AppSecret
                  - !Ref SensitiveDataSecret
                  - !Ref ClerkSecretArn
                  - !Ref MigratorDatabaseSecret
                  - !Ref ProductionAccessSecretArn

  JobRunnerExecutionRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: Shared execution role for periodic backend jobs (kall.jobs.*) run as one-shot ECS tasks on a schedule, not as a long-running service. Not attached to any EventBridge rule yet -- see JobRunnerTaskDefinition.
        must: [Never attach to a long-running service, Same runtime secret scope as ApiExecutionRole since jobs share the API's config/db access]
        mutable: change-with-constraints
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: kall-production-jobrunner-secrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref AppSecret
                  - !Ref SensitiveDataSecret
                  - !Ref ProductionAccessSecretArn
                  - !Ref ClerkSecretArn
                  - !Ref RuntimeDatabaseSecret
              - !If
                - HasOpenAISecret
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref OpenAISecretArn
                - !Ref AWS::NoValue
              - !If
                - HasSerperSecret
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref SerperSecretArn
                - !Ref AWS::NoValue

  JobRunnerTaskRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: Runtime role for periodic jobs, with SES access present only when the verified Kall sender parameter is configured.
        must: [SES is scoped to the Kall domain identity, No secret-read or infrastructure-management permissions]
        mutable: change-with-constraints
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole

  JobRunnerEmailPolicy:
    Type: AWS::IAM::Policy
    Condition: HasSesSender
    Metadata:
      com.aws.cloudformation.Context:
        why: Allows the scheduled notification worker to send only from the verified Kall domain identity.
        must: [Absent while sender is blank, No wildcard SES resource]
        mutable: change-with-constraints
    Properties:
      PolicyName: kall-production-jobrunner-email
      Roles: [!Ref JobRunnerTaskRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - ses:SendEmail
              - ses:SendRawEmail
            Resource: !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/skaldandstone.com

  JobSchedulerRole:
    Type: AWS::IAM::Role
    Condition: ScheduledJobsEnabled
    Metadata:
      com.aws.cloudformation.Context:
        why: Allows only this stack's two schedules to launch the reviewed one-shot ECS job task.
        must: [Run only JobRunnerTaskDefinition, Pass only its task and execution roles]
        mutable: change-with-constraints
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
                aws:SourceArn: !Sub arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule-group/${AWS::StackName}-jobs
      Policies:
        - PolicyName: kall-production-run-job-task
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecs:RunTask
                Resource: !Ref JobRunnerTaskDefinition
                Condition:
                  ArnEquals:
                    ecs:cluster: !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:cluster/${ClusterName}
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt JobRunnerExecutionRole.Arn
                  - !GetAtt JobRunnerTaskRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com

  WebExecutionRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: Pulls the web image and injects only the Clerk server secret used by the BFF proxy.
        must: [No database or billing secret access]
        mutable: change-with-constraints
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: kall-production-web-secrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref ClerkSecretArn

  ApiTaskRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: Grants the API access only to its production document bucket.
        must: [No access to development or other-product buckets]
        mutable: change-with-constraints
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: kall-production-document-storage
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DocumentBucket.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub '${DocumentBucket.Arn}/*'

  WebTaskRole:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: Explicit credential-free web runtime role.
        must: [No inline permissions]
        mutable: change-with-constraints
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole

  ApiLogs:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Durable production API diagnostics without a fixed physical name.
        must: [Retain for incident recovery]
        mutable: change-with-constraints
    Properties:
      RetentionInDays: 90

  WebLogs:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Durable production web and BFF diagnostics without a fixed physical name.
        must: [Retain for incident recovery]
        mutable: change-with-constraints
    Properties:
      RetentionInDays: 90

  DatabaseAdminLogs:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Audit trail for one-shot database bootstrap and migration tasks.
        must: [Retain for schema and access review]
        mutable: change-with-constraints
    Properties:
      RetentionInDays: 90

  DocumentBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Durable private storage for resumes and generated documents that must outlive Fargate tasks.
        must: [Block all public access, Encrypt at rest, Require TLS, Enable versioning, Retain on stack deletion]
        mutable: change-with-constraints
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Product
          Value: Kall
        - Key: Environment
          Value: production

  DocumentBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: Enforces encrypted transport for every principal using production documents.
        must: [Deny non-TLS access]
        mutable: change-with-constraints
    Properties:
      Bucket: !Ref DocumentBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt DocumentBucket.Arn
              - !Sub '${DocumentBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  OperationsTopic:
    Type: AWS::SNS::Topic
    Metadata:
      com.aws.cloudformation.Context:
        why: Product-scoped destination for production health and capacity alarms; subscriptions are managed separately to avoid sending unapproved mail.
        must: [No automatic subscription, Kall production alarms only]
        mutable: change-with-constraints
    Properties:
      KmsMasterKeyId: alias/aws/sns
      Tags:
        - Key: Product
          Value: Kall
        - Key: Environment
          Value: production

  OperationsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: Allows only this stack's CloudWatch alarms to publish operational state changes.
        must: [Source account match, Alarm ARN begins with the exact stack name]
        mutable: change-with-constraints
    Properties:
      Topics: [!Ref OperationsTopic]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowStackCloudWatchAlarms
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref OperationsTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${AWS::StackName}-*

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CloudFront and Kall web access to the production load balancer.
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: kall-production-alb

  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Kall web tasks, reachable only from the production load balancer.
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: kall-production-web

  ApiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Kall API tasks, reachable only from the production load balancer.
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: kall-production-api

  DatabaseAdminSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: One-shot Kall database bootstrap and migration tasks.
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: kall-production-database-admin

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Kall production PostgreSQL, reachable only from API tasks.
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: kall-production-database

  AlbFromCloudFrontIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref AlbSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourcePrefixListId: !Ref CloudFrontOriginPrefixListId

  AlbFromWebIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref AlbSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref WebSecurityGroup

  WebFromAlbIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref WebSecurityGroup
      IpProtocol: tcp
      FromPort: 3000
      ToPort: 3000
      SourceSecurityGroupId: !Ref AlbSecurityGroup

  ApiFromAlbIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ApiSecurityGroup
      IpProtocol: tcp
      FromPort: 8000
      ToPort: 8000
      SourceSecurityGroupId: !Ref AlbSecurityGroup

  DatabaseFromApiIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DatabaseSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref ApiSecurityGroup

  DatabaseFromAdminIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DatabaseSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref DatabaseAdminSecurityGroup

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnets for the private Kall production database.
      SubnetIds: !Ref PublicSubnetIds

  DatabaseParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Description: Kall production PostgreSQL requires encrypted client connections.
      Family: postgres16
      Parameters:
        rds.force_ssl: '1'

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Metadata:
      com.aws.cloudformation.Context:
        why: Private Multi-AZ PostgreSQL system of record for Kall production users, billing state, and workflow history.
        must: [Encryption at rest, verify-full clients, Seven-day backups, Deletion protection, Snapshot on deletion or replacement]
        mutable: review-required
        mutability:
          DeletionProtection: must-never-change
          StorageEncrypted: must-never-change
          VPCSecurityGroups: change-with-constraints
    Properties:
      Engine: postgres
      EngineVersion: '16.15'
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: '20'
      MaxAllocatedStorage: 100
      StorageType: gp3
      StorageEncrypted: true
      DBName: kall
      MasterUsername: kalladmin
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      DBParameterGroupName: !Ref DatabaseParameterGroup
      VPCSecurityGroups:
        - !Ref DatabaseSecurityGroup
      PubliclyAccessible: false
      MultiAZ: true
      BackupRetentionPeriod: 7
      PreferredBackupWindow: 10:00-10:30
      PreferredMaintenanceWindow: sun:11:00-sun:11:30
      AutoMinorVersionUpgrade: true
      CopyTagsToSnapshot: true
      DeletionProtection: true
      EnablePerformanceInsights: true
      Tags:
        - Key: Product
          Value: Kall
        - Key: Environment
          Value: production

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Metadata:
      com.aws.cloudformation.Context:
        why: TLS origin shared by CloudFront and the authenticated web BFF path.
        must: [CloudFront prefix-list ingress only, Web task may reach it without broad public ingress, Deletion protection]
        mutable: change-with-constraints
    Properties:
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      SecurityGroups:
        - !Ref AlbSecurityGroup
      Subnets: !Ref PublicSubnetIds
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'
        - Key: routing.http.xff_client_port.enabled
          Value: 'true'
        - Key: deletion_protection.enabled
          Value: 'true'

  WebTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 3000
      TargetType: ip
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: 200-399
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'

  ApiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 8000
      TargetType: ip
      HealthCheckPath: /ready
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTPS
      Port: 443
      Certificates:
        - CertificateArn: !Ref OriginCertificateArn
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref WebTargetGroup

  WebProxyListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 5
      Conditions:
        - Field: path-pattern
          Values:
            - /api/kall/*
      Actions:
        - Type: forward
          TargetGroupArn: !Ref WebTargetGroup

  ApiListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 10
      Conditions:
        - Field: path-pattern
          Values:
            - /api/*
      Actions:
        - Type: forward
          TargetGroupArn: !Ref ApiTargetGroup

  ResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-security-headers'
        Comment: Security headers for the Kall invite-only production service.
        SecurityHeadersConfig:
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: no-referrer
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true
          XSSProtection:
            Protection: true
            ModeBlock: true
            Override: true

  Distribution:
    Type: AWS::CloudFront::Distribution
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Public HTTPS boundary for kall.skaldandstone.com with Cloudflare-managed DNS and an HTTPS-only ALB origin.
        must: [TLS 1.2 minimum, No authenticated response caching, Retain on stack deletion, No Lambda at Edge]
        mutable: review-required
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Kall invite-only production
        PriceClass: PriceClass_100
        HttpVersion: http2and3
        IPV6Enabled: true
        Aliases: !If [PublicAliasAttached, [!Ref PublicDomainName], !Ref AWS::NoValue]
        Origins:
          - Id: kall-production-alb
            DomainName: !Ref OriginDomainName
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 5
        DefaultCacheBehavior:
          TargetOriginId: kall-production-alb
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [DELETE, GET, HEAD, OPTIONS, PATCH, POST, PUT]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3
          ResponseHeadersPolicyId: !Ref ResponseHeadersPolicy
        ViewerCertificate:
          AcmCertificateArn: !Ref ViewerCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

  ApiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Metadata:
      com.aws.cloudformation.Context:
        why: Non-root read-only FastAPI runtime with durable documents and least-privilege database credentials.
        must: [Immutable digest, Production Clerk, verify-full PostgreSQL, Monitoring and senders disabled initially]
        mutable: change-with-constraints
    Properties:
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt ApiExecutionRole.Arn
      TaskRoleArn: !GetAtt ApiTaskRole.Arn
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: kall-api
          Image: !Ref ApiImage
          Essential: true
          User: '10001:10001'
          ReadonlyRootFilesystem: true
          MountPoints:
            - SourceVolume: runtime-tmp
              ContainerPath: /tmp
              ReadOnly: false
            - SourceVolume: runtime-uploads
              ContainerPath: /app/uploads
              ReadOnly: false
            - SourceVolume: runtime-generated
              ContainerPath: /app/generated
              ReadOnly: false
          PortMappings:
            - ContainerPort: 8000
              Protocol: tcp
          Environment:
            - Name: APP_ENV
              Value: production
            - Name: AUTO_CREATE_TABLES
              Value: 'false'
            - Name: DB_HOST
              Value: !GetAtt Database.Endpoint.Address
            - Name: DB_PORT
              Value: !GetAtt Database.Endpoint.Port
            - Name: DB_NAME
              Value: kall
            - Name: DATABASE_SSL_MODE
              Value: verify-full
            - Name: DATABASE_SSL_ROOT_CERT
              Value: /etc/ssl/certs/aws-rds-us-east-2-bundle.pem
            - Name: FRONTEND_URL
              Value: !Sub https://${PublicDomainName}
            - Name: CLERK_AUTHORIZED_PARTIES
              Value: !Sub https://${PublicDomainName}
            - Name: AWS_REGION
              Value: us-east-2
            - Name: AWS_S3_BUCKET
              Value: !Ref DocumentBucket
            - Name: OPENAI_MODEL
              Value: gpt-5.6-luna
            - Name: ALPHA_INVITE_ONLY
              Value: !If [PublicSignupEnabled, 'false', 'true']
            - Name: STRIPE_ENABLED
              Value: !Ref EnableStripeLive
            - Name: STRIPE_LIVEMODE
              Value: !Ref EnableStripeLive
            - Name: STRIPE_BILLING_SCOPE
              Value: kall:production
            - Name: STRIPE_PRICE_ID
              Value: !Ref StripePlusPriceId
            - Name: STRIPE_PLUS_PRODUCT_ID
              Value: !Ref StripePlusProductId
            - Name: STRIPE_PREMIUM_PRICE_ID
              Value: !Ref StripePremiumPriceId
            - Name: STRIPE_PREMIUM_PRODUCT_ID
              Value: !Ref StripePremiumProductId
            - Name: STRIPE_PORTAL_CONFIGURATION_ID
              Value: !Ref StripePortalConfigurationId
            - Name: REVENUECAT_ENABLED
              Value: !Ref EnableRevenueCatNative
            - Name: REVENUECAT_ACCEPTED_ENVIRONMENTS
              Value: !Ref RevenueCatAcceptedEnvironments
            - Name: REVENUECAT_GOOGLE_PLUS_PRODUCT_ID
              Value: !Ref RevenueCatGooglePlusProductId
            - Name: REVENUECAT_GOOGLE_PREMIUM_PRODUCT_ID
              Value: !Ref RevenueCatGooglePremiumProductId
            - Name: REVENUECAT_APPLE_PLUS_PRODUCT_ID
              Value: !Ref RevenueCatApplePlusProductId
            - Name: REVENUECAT_APPLE_PREMIUM_PRODUCT_ID
              Value: !Ref RevenueCatApplePremiumProductId
            - Name: MONITORING_ENABLED
              Value: !Ref EnableScheduledJobs
            - Name: SES_SENDER_EMAIL
              Value: !If [HasSesSender, !Ref SesSenderEmail, '']
            - Name: SENTRY_DSN
              Value: !Ref SentryApiDsn
            - Name: SENTRY_ENVIRONMENT
              Value: production
          Secrets:
            - Name: APP_SECRET_KEY
              ValueFrom: !Ref AppSecret
            - Name: SENSITIVE_DATA_ENCRYPTION_KEY
              ValueFrom: !Ref SensitiveDataSecret
            - Name: DB_USER
              ValueFrom: !Sub '${RuntimeDatabaseSecret}:username::'
            - Name: DB_PASSWORD
              ValueFrom: !Sub '${RuntimeDatabaseSecret}:password::'
            - Name: CLERK_SECRET_KEY
              ValueFrom: !Sub '${ClerkSecretArn}:CLERK_SECRET_KEY::'
            - !If
              - StripeLiveEnabled
              - Name: STRIPE_SECRET_KEY
                ValueFrom: !Sub '${StripeSecretArn}:STRIPE_SECRET_KEY::'
              - !Ref AWS::NoValue
            - !If
              - StripeLiveEnabled
              - Name: STRIPE_WEBHOOK_SECRET
                ValueFrom: !Sub '${StripeSecretArn}:STRIPE_WEBHOOK_SECRET::'
              - !Ref AWS::NoValue
            - !If
              - RevenueCatNativeEnabled
              - Name: REVENUECAT_WEBHOOK_AUTHORIZATION
                ValueFrom: !Sub '${RevenueCatSecretArn}:REVENUECAT_WEBHOOK_AUTHORIZATION::'
              - !Ref AWS::NoValue
            - !If
              - RevenueCatNativeEnabled
              - Name: REVENUECAT_WEBHOOK_SIGNING_SECRET
                ValueFrom: !Sub '${RevenueCatSecretArn}:REVENUECAT_WEBHOOK_SIGNING_SECRET::'
              - !Ref AWS::NoValue
            - !If
              - RevenueCatNativeEnabled
              - Name: REVENUECAT_SECRET_API_KEY
                ValueFrom: !Sub '${RevenueCatSecretArn}:REVENUECAT_SECRET_API_KEY::'
              - !Ref AWS::NoValue
            - Name: ALPHA_ALLOWED_EMAILS
              ValueFrom: !Sub '${ProductionAccessSecretArn}:ALPHA_ALLOWED_EMAILS::'
            - !If
              - HasOpenAISecret
              - Name: OPENAI_API_KEY
                ValueFrom: !Sub '${OpenAISecretArn}:OPENAI_API_KEY::'
              - !Ref AWS::NoValue
            - !If
              - HasSerperSecret
              - Name: SERPER_API_KEY
                ValueFrom: !Sub '${SerperSecretArn}:SERPER_API_KEY::'
              - !Ref AWS::NoValue
            - !If
              - HasAdminSecret
              - Name: ADMIN_API_TOKEN
                ValueFrom: !Sub '${AdminSecretArn}:ADMIN_API_TOKEN::'
              - !Ref AWS::NoValue
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApiLogs
              awslogs-region: us-east-2
              awslogs-stream-prefix: ecs
          HealthCheck:
            Command:
              - CMD-SHELL
              - >-
                python -c "import urllib.request;
                urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60
      Volumes:
        - Name: runtime-tmp
        - Name: runtime-uploads
        - Name: runtime-generated

  BootstrapTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Metadata:
      com.aws.cloudformation.Context:
        why: One-shot task creates or rotates exact runtime and migrator roles through the RDS-managed master.
        must: [Run before migrations, Never run as a service, Use verify-full TLS]
        mutable: change-with-constraints
    Properties:
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt BootstrapExecutionRole.Arn
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: kall-database-bootstrap
          Image: !Ref ApiImage
          Essential: true
          User: '10001:10001'
          ReadonlyRootFilesystem: true
          Command: [python, -m, kall.jobs.bootstrap_database_roles]
          MountPoints:
            - SourceVolume: bootstrap-tmp
              ContainerPath: /tmp
              ReadOnly: false
          Environment:
            - Name: DB_HOST
              Value: !GetAtt Database.Endpoint.Address
            - Name: DB_PORT
              Value: !GetAtt Database.Endpoint.Port
            - Name: DB_NAME
              Value: kall
            - Name: DATABASE_SSL_MODE
              Value: verify-full
            - Name: DATABASE_SSL_ROOT_CERT
              Value: /etc/ssl/certs/aws-rds-us-east-2-bundle.pem
          Secrets:
            - Name: MASTER_DB_USER
              ValueFrom: !Sub '${Database.MasterUserSecret.SecretArn}:username::'
            - Name: MASTER_DB_PASSWORD
              ValueFrom: !Sub '${Database.MasterUserSecret.SecretArn}:password::'
            - Name: MIGRATOR_DB_USER
              ValueFrom: !Sub '${MigratorDatabaseSecret}:username::'
            - Name: MIGRATOR_DB_PASSWORD
              ValueFrom: !Sub '${MigratorDatabaseSecret}:password::'
            - Name: RUNTIME_DB_USER
              ValueFrom: !Sub '${RuntimeDatabaseSecret}:username::'
            - Name: RUNTIME_DB_PASSWORD
              ValueFrom: !Sub '${RuntimeDatabaseSecret}:password::'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref DatabaseAdminLogs
              awslogs-region: us-east-2
              awslogs-stream-prefix: bootstrap
      Volumes:
        - Name: bootstrap-tmp

  MigrationTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Metadata:
      com.aws.cloudformation.Context:
        why: One-shot Alembic task applies and verifies the reviewed production schema head.
        must: [Run after bootstrap, Billing disabled, Never use runtime or master credentials]
        mutable: change-with-constraints
    Properties:
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt MigrationExecutionRole.Arn
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: kall-migration
          Image: !Ref ApiImage
          Essential: true
          User: '10001:10001'
          ReadonlyRootFilesystem: true
          Command: [python, -m, kall.jobs.migrate_database]
          MountPoints:
            - SourceVolume: migration-tmp
              ContainerPath: /tmp
              ReadOnly: false
          Environment:
            - Name: APP_ENV
              Value: production
            - Name: AUTO_CREATE_TABLES
              Value: 'false'
            - Name: DB_HOST
              Value: !GetAtt Database.Endpoint.Address
            - Name: DB_PORT
              Value: !GetAtt Database.Endpoint.Port
            - Name: DB_NAME
              Value: kall
            - Name: DATABASE_SSL_MODE
              Value: verify-full
            - Name: DATABASE_SSL_ROOT_CERT
              Value: /etc/ssl/certs/aws-rds-us-east-2-bundle.pem
            - Name: FRONTEND_URL
              Value: !Sub https://${PublicDomainName}
            - Name: CLERK_AUTHORIZED_PARTIES
              Value: !Sub https://${PublicDomainName}
            - Name: AWS_REGION
              Value: us-east-2
            - Name: AWS_S3_BUCKET
              Value: !Ref DocumentBucket
            - Name: ALPHA_INVITE_ONLY
              Value: !If [PublicSignupEnabled, 'false', 'true']
            - Name: STRIPE_ENABLED
              Value: 'false'
            - Name: STRIPE_LIVEMODE
              Value: 'false'
            - Name: MONITORING_ENABLED
              Value: 'false'
          Secrets:
            - Name: APP_SECRET_KEY
              ValueFrom: !Ref AppSecret
            - Name: SENSITIVE_DATA_ENCRYPTION_KEY
              ValueFrom: !Ref SensitiveDataSecret
            - Name: DB_USER
              ValueFrom: !Sub '${MigratorDatabaseSecret}:username::'
            - Name: DB_PASSWORD
              ValueFrom: !Sub '${MigratorDatabaseSecret}:password::'
            - Name: CLERK_SECRET_KEY
              ValueFrom: !Sub '${ClerkSecretArn}:CLERK_SECRET_KEY::'
            - Name: ALPHA_ALLOWED_EMAILS
              ValueFrom: !Sub '${ProductionAccessSecretArn}:ALPHA_ALLOWED_EMAILS::'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref DatabaseAdminLogs
              awslogs-region: us-east-2
              awslogs-stream-prefix: migration
      Volumes:
        - Name: migration-tmp

  JobRunnerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Metadata:
      com.aws.cloudformation.Context:
        why: One task-definition family for every periodic kall.jobs.* script, run as a scheduled one-shot ECS task rather than a long-running service. Not yet targeted by any EventBridge rule -- each future schedule overrides Command at the rule's target rather than needing a new task definition per job.
        must: [Never run as a service, No PortMappings or HealthCheck -- this is not addressable]
        mutable: change-with-constraints
    Properties:
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt JobRunnerExecutionRole.Arn
      TaskRoleArn: !GetAtt JobRunnerTaskRole.Arn
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: kall-job-runner
          Image: !Ref ApiImage
          Essential: true
          User: '10001:10001'
          ReadonlyRootFilesystem: true
          # Placeholder command: no schedule targets this task definition yet,
          # so nothing actually runs it. Each EventBridge rule that does will
          # override Command with the specific `python -m kall.jobs.<name>`
          # it wants, the same way RunTask overrides are used elsewhere.
          Command: [python, -m, kall.jobs.notifications, --help]
          MountPoints:
            - SourceVolume: jobrunner-tmp
              ContainerPath: /tmp
              ReadOnly: false
          Environment:
            - Name: APP_ENV
              Value: production
            - Name: AUTO_CREATE_TABLES
              Value: 'false'
            - Name: DB_HOST
              Value: !GetAtt Database.Endpoint.Address
            - Name: DB_PORT
              Value: !GetAtt Database.Endpoint.Port
            - Name: DB_NAME
              Value: kall
            - Name: DATABASE_SSL_MODE
              Value: verify-full
            - Name: DATABASE_SSL_ROOT_CERT
              Value: /etc/ssl/certs/aws-rds-us-east-2-bundle.pem
            - Name: FRONTEND_URL
              Value: !Sub https://${PublicDomainName}
            - Name: CLERK_AUTHORIZED_PARTIES
              Value: !Sub https://${PublicDomainName}
            - Name: AWS_REGION
              Value: us-east-2
            - Name: AWS_S3_BUCKET
              Value: !Ref DocumentBucket
            - Name: ALPHA_INVITE_ONLY
              Value: !If [PublicSignupEnabled, 'false', 'true']
            - Name: OPENAI_MODEL
              Value: gpt-5.6-luna
            - Name: MONITORING_ENABLED
              Value: !Ref EnableScheduledJobs
            - Name: SES_SENDER_EMAIL
              Value: !If [HasSesSender, !Ref SesSenderEmail, '']
            - Name: SENTRY_DSN
              Value: !Ref SentryApiDsn
            - Name: SENTRY_ENVIRONMENT
              Value: production
          Secrets:
            - Name: APP_SECRET_KEY
              ValueFrom: !Ref AppSecret
            - Name: SENSITIVE_DATA_ENCRYPTION_KEY
              ValueFrom: !Ref SensitiveDataSecret
            - Name: DB_USER
              ValueFrom: !Sub '${RuntimeDatabaseSecret}:username::'
            - Name: DB_PASSWORD
              ValueFrom: !Sub '${RuntimeDatabaseSecret}:password::'
            - Name: CLERK_SECRET_KEY
              ValueFrom: !Sub '${ClerkSecretArn}:CLERK_SECRET_KEY::'
            - Name: ALPHA_ALLOWED_EMAILS
              ValueFrom: !Sub '${ProductionAccessSecretArn}:ALPHA_ALLOWED_EMAILS::'
            - !If
              - HasOpenAISecret
              - Name: OPENAI_API_KEY
                ValueFrom: !Sub '${OpenAISecretArn}:OPENAI_API_KEY::'
              - !Ref AWS::NoValue
            - !If
              - HasSerperSecret
              - Name: SERPER_API_KEY
                ValueFrom: !Sub '${SerperSecretArn}:SERPER_API_KEY::'
              - !Ref AWS::NoValue
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApiLogs
              awslogs-region: us-east-2
              awslogs-stream-prefix: jobrunner
      Volumes:
        - Name: jobrunner-tmp

  JobScheduleGroup:
    Type: AWS::Scheduler::ScheduleGroup
    Condition: ScheduledJobsEnabled
    Properties:
      Name: !Sub ${AWS::StackName}-jobs

  HourlyJobSchedule:
    Type: AWS::Scheduler::Schedule
    Condition: ScheduledJobsEnabled
    Properties:
      Name: hourly
      GroupName: !Ref JobScheduleGroup
      Description: Kall hourly billing, brief, discovery, and notification delivery suite.
      ScheduleExpression: rate(1 hour)
      FlexibleTimeWindow:
        Mode: 'OFF'
      State: ENABLED
      Target:
        Arn: !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:cluster/${ClusterName}
        RoleArn: !GetAtt JobSchedulerRole.Arn
        Input: '{"containerOverrides":[{"name":"kall-job-runner","command":["python","-m","kall.jobs.hourly"]}]}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 900
          MaximumRetryAttempts: 0
        EcsParameters:
          TaskDefinitionArn: !Ref JobRunnerTaskDefinition
          LaunchType: FARGATE
          TaskCount: 1
          NetworkConfiguration:
            AwsvpcConfiguration:
              AssignPublicIp: ENABLED
              SecurityGroups: [!Ref ApiSecurityGroup]
              Subnets: !Ref PublicSubnetIds

  DailyJobSchedule:
    Type: AWS::Scheduler::Schedule
    Condition: ScheduledJobsEnabled
    Properties:
      Name: daily
      GroupName: !Ref JobScheduleGroup
      Description: Kall daily retention and career reminder suite.
      ScheduleExpression: cron(30 6 * * ? *)
      ScheduleExpressionTimezone: UTC
      FlexibleTimeWindow:
        Mode: 'OFF'
      State: ENABLED
      Target:
        Arn: !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:cluster/${ClusterName}
        RoleArn: !GetAtt JobSchedulerRole.Arn
        Input: '{"containerOverrides":[{"name":"kall-job-runner","command":["python","-m","kall.jobs.daily"]}]}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 900
          MaximumRetryAttempts: 0
        EcsParameters:
          TaskDefinitionArn: !Ref JobRunnerTaskDefinition
          LaunchType: FARGATE
          TaskCount: 1
          NetworkConfiguration:
            AwsvpcConfiguration:
              AssignPublicIp: ENABLED
              SecurityGroups: [!Ref ApiSecurityGroup]
              Subnets: !Ref PublicSubnetIds

  WebTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Metadata:
      com.aws.cloudformation.Context:
        why: Production Next.js frontend and authenticated BFF built with the production Clerk publishable key.
        must: [Immutable digest, Clerk secret only, KALL_API_URL uses the public CloudFront hostname, Sentry DSN is a plaintext parameter not a secret]
        mutable: change-with-constraints
    Properties:
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt WebExecutionRole.Arn
      TaskRoleArn: !GetAtt WebTaskRole.Arn
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: kall-web
          Image: !Ref WebImage
          Essential: true
          PortMappings:
            - ContainerPort: 3000
              Protocol: tcp
          Environment:
            - Name: NODE_ENV
              Value: production
            - Name: KALL_API_URL
              Value: !Sub https://${PublicDomainName}
            - Name: ALPHA_INVITE_ONLY
              Value: !If [PublicSignupEnabled, 'false', 'true']
            - Name: SENTRY_DSN
              Value: !Ref SentryWebDsn
            - Name: SENTRY_ENVIRONMENT
              Value: production
          Secrets:
            - Name: CLERK_SECRET_KEY
              ValueFrom: !Sub '${ClerkSecretArn}:CLERK_SECRET_KEY::'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref WebLogs
              awslogs-region: us-east-2
              awslogs-stream-prefix: ecs

  ApiService:
    Type: AWS::ECS::Service
    DependsOn: ApiListenerRule
    Metadata:
      com.aws.cloudformation.Context:
        why: Long-running API remains at zero until bootstrap and migration evidence is recorded in the stack parameters.
        must: [Desired count controlled only by fail-closed activation rule, Deployment rollback enabled]
        mutable: change-with-constraints
    Properties:
      Cluster: !Ref ClusterName
      TaskDefinition: !Ref ApiTaskDefinition
      DesiredCount: !If [ApplicationServicesEnabled, 1, 0]
      LaunchType: FARGATE
      PlatformVersion: LATEST
      EnableECSManagedTags: true
      PropagateTags: TASK_DEFINITION
      HealthCheckGracePeriodSeconds: 180
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups: [!Ref ApiSecurityGroup]
          Subnets: !Ref PublicSubnetIds
      LoadBalancers:
        - ContainerName: kall-api
          ContainerPort: 8000
          TargetGroupArn: !Ref ApiTargetGroup

  WebService:
    Type: AWS::ECS::Service
    DependsOn: HttpsListener
    Metadata:
      com.aws.cloudformation.Context:
        why: Long-running web service starts together with the API only after database evidence exists.
        must: [Desired count controlled only by fail-closed activation rule, Deployment rollback enabled]
        mutable: change-with-constraints
    Properties:
      Cluster: !Ref ClusterName
      TaskDefinition: !Ref WebTaskDefinition
      DesiredCount: !If [ApplicationServicesEnabled, 1, 0]
      LaunchType: FARGATE
      PlatformVersion: LATEST
      EnableECSManagedTags: true
      PropagateTags: TASK_DEFINITION
      HealthCheckGracePeriodSeconds: 120
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups: [!Ref WebSecurityGroup]
          Subnets: !Ref PublicSubnetIds
      LoadBalancers:
        - ContainerName: kall-web
          ContainerPort: 3000
          TargetGroupArn: !Ref WebTargetGroup

  ApiUnhealthyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-api-unhealthy'
      AlarmDescription: Kall production API has an unhealthy load balancer target.
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OperationsTopic]
      OKActions: [!Ref OperationsTopic]
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt LoadBalancer.LoadBalancerFullName
        - Name: TargetGroup
          Value: !GetAtt ApiTargetGroup.TargetGroupFullName

  WebUnhealthyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-web-unhealthy'
      AlarmDescription: Kall production web has an unhealthy load balancer target.
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OperationsTopic]
      OKActions: [!Ref OperationsTopic]
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt LoadBalancer.LoadBalancerFullName
        - Name: TargetGroup
          Value: !GetAtt WebTargetGroup.TargetGroupFullName

  ApiTarget5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-api-target-5xx'
      AlarmDescription: Kall production API target returned at least five server errors in five minutes.
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OperationsTopic]
      OKActions: [!Ref OperationsTopic]
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt LoadBalancer.LoadBalancerFullName
        - Name: TargetGroup
          Value: !GetAtt ApiTargetGroup.TargetGroupFullName

  WebTarget5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-web-target-5xx'
      AlarmDescription: Kall production web target returned at least five server errors in five minutes.
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref OperationsTopic]
      OKActions: [!Ref OperationsTopic]
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt LoadBalancer.LoadBalancerFullName
        - Name: TargetGroup
          Value: !GetAtt WebTargetGroup.TargetGroupFullName

  DatabaseFreeStorageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-database-free-storage'
      AlarmDescription: Kall production PostgreSQL has less than 2 GiB free storage for ten minutes.
      Namespace: AWS/RDS
      MetricName: FreeStorageSpace
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 2147483648
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref OperationsTopic]
      OKActions: [!Ref OperationsTopic]
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref Database

  DatabaseCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-database-cpu'
      AlarmDescription: Kall production PostgreSQL CPU is above 85 percent for fifteen minutes.
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 85
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref OperationsTopic]
      OKActions: [!Ref OperationsTopic]
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref Database

Outputs:
  ProductionUrl:
    Value: !Sub https://${PublicDomainName}
  DistributionId:
    Value: !Ref Distribution
  LoadBalancerDnsName:
    Value: !GetAtt LoadBalancer.DNSName
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  ApiServiceName:
    Value: !GetAtt ApiService.Name
  WebServiceName:
    Value: !GetAtt WebService.Name
  BootstrapTaskDefinitionArn:
    Value: !Ref BootstrapTaskDefinition
  MigrationTaskDefinitionArn:
    Value: !Ref MigrationTaskDefinition
  JobRunnerTaskDefinitionArn:
    Value: !Ref JobRunnerTaskDefinition
  ScheduledJobsEnabled:
    Value: !Ref EnableScheduledJobs
  TransactionalEmailSender:
    Value: !If [HasSesSender, !Ref SesSenderEmail, unconfigured]
  DatabaseAdminSecurityGroupId:
    Value: !Ref DatabaseAdminSecurityGroup
  ApplicationServicesEnabled:
    Value: !Ref EnableApplicationServices
  DocumentBucketName:
    Value: !Ref DocumentBucket
  OperationsTopicArn:
    Value: !Ref OperationsTopic
  RuntimeDatabaseSecretArn:
    Value: !Ref RuntimeDatabaseSecret
  MigratorDatabaseSecretArn:
    Value: !Ref MigratorDatabaseSecret
