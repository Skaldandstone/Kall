[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kall-career-platform"
version = "0.9.0"
description = "Privacy-first career identity and application platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlmodel>=0.0.24,<1",
  "alembic>=1.16,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "cryptography>=45,<46",
  "httpx>=0.28,<1",
  "python-docx>=1.2,<2",
  "pypdf>=5.9,<6",
  "reportlab>=4.4,<5",
  "openai>=1.99,<2",
  "stripe==15.6.0",
  "email-validator>=2.2,<3",
  "jinja2>=3.1,<4",
  "pyyaml>=6,<7",
  "clerk-backend-api>=7,<8",
  "boto3>=1.34,<2",
  "slowapi>=0.1.9,<1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "pytest-asyncio>=1.0,<2",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2"
]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
# Every test here is a plain function. Without this, pytest tries to collect
# domain models whose names happen to start with "Test" -- Testimonial and
# TestimonialRequest -- and warns that it cannot, which is noise about code
# that was never a test.
python_classes = []

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = [
  "B008",  # FastAPI Depends() as default argument is intentional
  "E501",  # Line length enforced by formatter, not linter
]

[tool.ruff.lint.per-file-ignores]
"backend/kall/models/__init__.py" = ["F403"]  # Re-export module uses wildcard imports by design

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
